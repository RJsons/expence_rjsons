services:
  - type: web
    name: expence-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set DATABASE_URL in the Render dashboard → Environment tab.
      # Use the "Internal Database URL" from your Render PostgreSQL service.
      # If not set, the app falls back to SQLite (data is lost on redeploy).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
